name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          clj-kondo: 2026.01.19
      - name: Run clj-kondo
        run: clj-kondo --lint src --fail-level error

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          lein: 2.11.2
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('project.clj') }}
          restore-keys: ${{ runner.os }}-maven-
      # Test lists live in project.clj :test-selectors (shared with release.yml).
      - run: lein test :unit

  # Runs on PRs too. The :integration namespaces run as two parallel jobs
  # (`integration-namespaces` in project.clj): the module and query layer,
  # and the SAIL and server layer.
  integration-test:
    name: integration-test (${{ matrix.half }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        half: [module, sail]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          lein: 2.11.2
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('project.clj') }}
          restore-keys: ${{ runner.os }}-maven-
      - run: lein test :integration-${{ matrix.half }}

  # W3C conformance harnesses guard the skip lists both ways (unexpected
  # failures AND unexpected passes fail the job). Push-to-main only.
  w3c-conformance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          lein: 2.11.2
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('project.clj') }}
          restore-keys: ${{ runner.os }}-maven-
      - run: lein test :w3c
